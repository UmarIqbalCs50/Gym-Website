<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — XYZ Fitness</title>
<link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest"><link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand" id="brandName">HM <span class="brand-accent">Fitness</span></a>
    <div class="nav-links"><a href="/login.html">Back to login</a></div>
  </div>
</nav>
<div class="auth-wrap">
  <div class="card">
    <h1>Forgot password?</h1>
    <div class="sub">No worries — enter your email and we'll send you a reset link.</div>
    <div class="msg" id="msg"></div>
    <form id="forgotForm">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
    </form>
    <div class="foot-link"><a href="/login.html">← Back to login</a></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  API.getSettings().then(s => {
    document.getElementById("brandName").innerHTML =
      s.gymName.split(" ").map((w,i)=> i===0 ? w : `<span class="brand-accent">${w}</span>`).join(" ");
  }).catch(() => {});
</script>
<script>
  const msg = document.getElementById("msg");
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg(msg);
    const email = document.getElementById("email").value.trim();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
      await API.forgotPassword(email);
      showMsg(msg, "If an account with that email exists, a reset link has been sent. Please check your inbox (and spam folder).", "success");
      document.getElementById("forgotForm").style.display = "none";
    } catch (err) {
      showMsg(msg, err.message);
      btn.disabled = false;
      btn.textContent = "Send reset link";
    }
  });
</script>
</body>
</html>
