<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — HM Fitness</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">HM <span class="brand-accent">Fitness</span></a>
  </div>
</nav>
<div class="auth-wrap">
  <div class="card">
    <h1>Reset your password</h1>
    <div class="sub">Choose a new strong password for your account.</div>
    <div class="msg" id="msg"></div>
    <form id="resetForm">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" placeholder="New password" required>
        <div class="password-criteria">
          <div class="criterion" id="c-length"><span class="criterion-icon">✗</span> At least 8 characters</div>
          <div class="criterion" id="c-upper"><span class="criterion-icon">✗</span> At least 1 uppercase letter</div>
          <div class="criterion" id="c-number"><span class="criterion-icon">✗</span> At least 1 number</div>
        </div>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" placeholder="Re-enter new password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset password</button>
    </form>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  const msg = document.getElementById("msg");
  const token = new URLSearchParams(window.location.search).get("token");
  if (!token) {
    showMsg(msg, "Invalid or missing reset link. Please request a new one.");
    document.getElementById("resetForm").style.display = "none";
  }

  const passwordInput = document.getElementById("password");
  function setCriterion(id, passed) {
    const el = document.getElementById(id);
    const icon = el.querySelector(".criterion-icon");
    el.classList.toggle("passed", passed);
    icon.textContent = passed ? "✓" : "✗";
  }
  passwordInput.addEventListener("input", () => {
    const v = passwordInput.value;
    setCriterion("c-length", v.length >= 8);
    setCriterion("c-upper", /[A-Z]/.test(v));
    setCriterion("c-number", /[0-9]/.test(v));
  });

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg(msg);
    const newPassword = passwordInput.value;
    const confirm = document.getElementById("confirm").value;
    if (newPassword !== confirm) return showMsg(msg, "Passwords do not match.");
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Resetting...";
    try {
      await API.resetPassword(token, newPassword);
      showMsg(msg, "Password reset successfully! You can now log in with your new password.", "success");
      document.getElementById("resetForm").style.display = "none";
      setTimeout(() => window.location.href = "/login.html", 2500);
    } catch (err) {
      showMsg(msg, err.message);
      btn.disabled = false;
      btn.textContent = "Reset password";
    }
  });
</script>
</body>
</html>
