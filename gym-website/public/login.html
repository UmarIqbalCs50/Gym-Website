<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — XYZ Fitness</title>
<link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand" id="brandName">XY <span class="brand-accent">Fitness</span></a>
    <div class="nav-links">
      <a href="/signup.html">New here? Sign up</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="card">
    <h1>Log in</h1>
    <div class="sub">Access your plan, workouts and diet.</div>

    <div class="msg" id="msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="03001234567" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
    </form>

    <div class="foot-link"><a href="/forgot-password.html">Forgot your password?</a></div>
    <div class="foot-link">Don't have an account? <a href="/signup.html">Create one</a></div>
    <div class="foot-link"><a href="/admin.html">Admin panel →</a></div>

  </div>
</div>

<script src="/js/api.js"></script>
<script>
  API.getSettings().then(s => {
    document.getElementById("brandName").innerHTML =
      s.gymName.split(" ").map((w,i)=> i===0 ? w : `<span class="brand-accent">${w}</span>`).join(" ");
  }).catch(() => {});
</script>
<script src="/js/whatsapp.js"></script>
<script>
    API.getSettings().then(s => {
    document.getElementById("brandName").innerHTML =
      s.gymName.split(" ").map((w,i)=> i===0 ? w : `<span class="brand-accent">${w}</span>`).join(" ");
  });
</script>
<script>
  const msg = document.getElementById("msg");
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg(msg);
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Logging in...";

    try {
      const { token, user } = await API.login({ phone, password });
      API.setToken(token);
      window.location.href = user.plan ? "/dashboard.html" : "/buy-plan.html";
    } catch (err) {
      showMsg(msg, err.message);
      btn.disabled = false;
      btn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
